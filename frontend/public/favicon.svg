<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <g transform="rotate(45 50 50)">
    <!-- Top Half (White) -->
    <path d="M 30 49 L 30 32 A 20 20 0 0 1 70 32 L 70 49 Z" fill="#FFFFFF" />
    
    <!-- Bottom Half (Blue Accent) -->
    <path d="M 30 51 L 70 51 L 70 68 A 20 20 0 0 1 30 68 Z" fill="#5CC1F5" />
    
    <!-- Outer thick stroke -->
    <rect x="30" y="12" width="40" height="76" rx="20" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" />
    
    <!-- Center connecting line / gap shadow -->
    <line x1="28" y1="50" x2="72" y2="50" stroke="#000000" stroke-width="4" stroke-linecap="round" />
    
    <!-- Glossy Highlight -->
    <path d="M 38 42 L 38 28 A 12 12 0 0 1 50 18" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.8" />
  </g>
</svg>
